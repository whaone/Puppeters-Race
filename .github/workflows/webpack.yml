name: Strava Beacon Tracker Run

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js (Version 22)
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install Dependencies
      run: npm install
      env:
        CI: true

    - name: Install Puppeteer Chrome Binary
      run: npx puppeteer browsers install chrome

    - name: Run Tracker Script
      # PENTING: Ganti 'index.js' di bawah ini dengan nama file utama proyek Anda
      # (Contoh jika nama filenya: server.js, app.js, atau index.js)
      run: node index.js
