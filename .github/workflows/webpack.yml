name: Strava Beacon Tracker Run

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

  # Mengatur waktu maksimal berjalan agar tidak memakan kuota GitHub Actions Anda
    timeout-minutes: 5 

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js (Version 22)
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install Dependencies
      run: npm install
      env:
        CI: true

    - name: Install Puppeteer Chrome Binary
      run: npx puppeteer browsers install chrome

    - name: Run Tracker Script (Auto-Detect File)
      run: |
        if [ -f "server.js" ]; then
          echo "Mendeseksi server.js... Menjalankan aplikasi."
          node server.js
        elif [ -f "app.js" ]; then
          echo "Mendeteksi app.js... Menjalankan aplikasi."
          node app.js
        elif [ -f "main.js" ]; then
          echo "Mendeteksi main.js... Menjalankan aplikasi."
          node main.js
        elif [ -f "index.js" ]; then
          echo "Mendeteksi index.js... Menjalankan aplikasi."
          node index.js
        else
          echo "========================================================="
          echo "❌ ERROR: File utama tidak ditemukan di root folder!"
          echo "Berikut adalah struktur file asli di dalam repositori Anda:"
          echo "========================================================="
          ls -R
          exit 1
        fi
