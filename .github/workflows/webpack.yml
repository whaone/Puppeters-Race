name: Strava Beacon Tracker Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js (Version 22)
      uses: actions/setup-node@v4
      with:
        node-version: '22' # Memperbaiki masalah EBADENGINE Puppeteer

    - name: Install Dependencies
      run: npm install
      env:
        CI: true # Memastikan npm berjalan dalam mode non-interaktif (tanpa prompt otomatis)

    # Catatan: Diperlukan jika workflow ini bertugas menjalankan Puppeteer secara langsung
    - name: Install Puppeteer Chrome Binary
      run: npx puppeteer browsers install chrome

    - name: Run Build / Script
      run: npx webpack --yes 
      env:
        CI: true
